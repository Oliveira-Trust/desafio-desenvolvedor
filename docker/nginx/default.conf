# nginx/default.conf

server {
    listen 80;
    server_name localhost; # Ou o domínio que você pretende usar
    root /var/www/html/public; # Diretório público do Laravel
    
    # Increase upload size limit
    client_max_body_size 100M;

    index index.php index.html index.htm;

    charset utf-8;

    # Log files
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Adicionar cabeçalhos de segurança (opcional, mas recomendado)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Lidar com arquivos estáticos diretamente
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|webp|svg|woff|woff2|ttf|eot)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Redirecionar erros 404 para o index.php
    error_page 404 /index.php;

    # Passar requisições PHP para o PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Use o nome do serviço PHP-FPM definido no docker-compose.yml (ex: 'app' ou 'php')
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300; # Aumentar timeout para uploads/processamentos longos
    }

    # Bloquear acesso a arquivos ocultos (ex: .env)
    location ~ /\.ht {
        deny all;
    }
    location ~ /\.git {
        deny all;
    }
}