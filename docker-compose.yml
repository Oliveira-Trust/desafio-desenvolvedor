# docker-compose.yml

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    image: laravel_app
    container_name: laravel_app
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-80}:8080"
    environment:
      PHP_MEMORY_LIMIT: "256M"
      PHP_OPCACHE_ENABLE: "1"
      PHP_MAX_EXECUTION_TIME: "60"
      PHP_UPLOAD_MAX_FILE_SIZE: "50M"
      PHP_POST_MAX_SIZE: "50M"
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      NGINX_CLIENT_MAX_BODY_SIZE: "50M"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - laravel_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: queue
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    image: laravel_queue
    container_name: laravel_queue
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "php", "artisan", "horizon:status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - laravel_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    image: laravel_scheduler
    container_name: laravel_scheduler
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - laravel_network

  redis:
    image: redis:7.2-alpine
    container_name: laravel_redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        else
          exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c '
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping
          else
            redis-cli ping
          fi
        '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - laravel_network

  mongo:
    image: mongo:7.0
    container_name: laravel_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${DB_USERNAME:-laravel_user}"
      MONGO_INITDB_ROOT_PASSWORD: "${DB_PASSWORD:-secret}"
      MONGO_INITDB_DATABASE: "${DB_DATABASE:-laravel}"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: >
        mongosh
        --quiet
        --username "${DB_USERNAME:-laravel_user}"
        --password "${DB_PASSWORD:-secret}"
        --authenticationDatabase admin
        --eval "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - laravel_network

volumes:
  mongo_data:
  mongo_config:
  redis_data:

networks:
  laravel_network:
    driver: bridge
