version: '3'

services:
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: finance-api-app
    volumes:
      - ./laravel-app:/var/www/html
    depends_on:
      - mysql
      - mongodb
      - redis
      - rabbitmq
    networks:
      - finance-network
    
  nginx:
    image: nginx:alpine
    container_name: finance-api-nginx
    ports:
      - "80:80"
    volumes:
      - ./laravel-app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - finance-network

  mysql:
    image: mysql:8.0
    container_name: finance-api-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: finance_api
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: finance
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - finance-network

  mongodb:
    image: mongo:latest
    container_name: finance-api-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: finance_api
    volumes:
      - mongo_data:/data/db
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - finance-network

  redis:
    image: redis:alpine
    container_name: finance-api-redis
    ports:
      - "6379:6379"
    networks:
      - finance-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: finance-api-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - finance-network

  worker:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: finance-api-worker
    command: php artisan queue:work --queue=file-processing
    volumes:
      - ./laravel-app:/var/www/html
    depends_on:
      - app
      - mysql
      - mongodb
      - redis
      - rabbitmq
    networks:
      - finance-network

networks:
  finance-network:
    driver: bridge

volumes:
  mysql_data:
  mongo_data: